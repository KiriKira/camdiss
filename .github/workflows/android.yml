name: Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camdiss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMDISS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CAMDISS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAMDISS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAMDISS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p app/config
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/config/release.keystore
          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle :app:assembleDebug --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Verify persistent signing certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/camdiss-apksigner.txt
          CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' /tmp/camdiss-apksigner.txt)"
          test "$CERT_SHA256" = "ed686a582e601d12760495d42b0e844ac89f79bfe939c3fd7c5d4853f87f8a5f"
          printf '%s  %s\n' "$(sha256sum "$APK" | awk '{print $1}')" "$(basename "$APK")" > app/build/outputs/apk/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CamDiss-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
