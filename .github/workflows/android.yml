name: Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camdiss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Detect persistent signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMDISS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CAMDISS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAMDISS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAMDISS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMDISS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CAMDISS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAMDISS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAMDISS_KEY_PASSWORD }}
        run: |
          mkdir -p app/config
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/config/release.keystore
          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Warn when signing is unavailable
        if: github.event_name != 'pull_request' && steps.signing.outputs.available != 'true'
        run: |
          echo '::warning::Persistent CamDiss signing secrets are not configured. Building only for validation; no APK will be published.'

      - name: Build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify persistent signing certificate
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          OUT=app/build/outputs/apk/release
          APK="$OUT/app-release.apk"
          NAMED_APK="$OUT/CamDiss-v0.1.4.apk"
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/camdiss-apksigner.txt
          CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' /tmp/camdiss-apksigner.txt)"
          test "$CERT_SHA256" = "ed686a582e601d12760495d42b0e844ac89f79bfe939c3fd7c5d4853f87f8a5f"
          cp "$APK" "$NAMED_APK"
          cd "$OUT"
          sha256sum CamDiss-v0.1.4.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        with:
          name: CamDiss-signed
          path: |
            app/build/outputs/apk/release/CamDiss-v0.1.4.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && steps.signing.outputs.available == 'true' && github.event.head_commit.message == 'Publish signed CamDiss v0.1.4'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          target_commitish: ${{ github.sha }}
          name: CamDiss v0.1.4
          body: |
            Make Wireless debugging navigation deterministic.

            - Always opens the Wireless debugging page immediately after the user taps Run.
            - Starts ADB connect/pair mDNS discovery before opening Settings.
            - Reuses an existing CamDiss pairing automatically when Wireless debugging is already enabled.
            - Does not rely on Samsung's potentially stale `adb_wifi_enabled` value.
            - Keeps the existing-pairing reuse and shell stream-closure fixes from v0.1.2/v0.1.3.

            Signing certificate SHA-256:
            `ed686a582e601d12760495d42b0e844ac89f79bfe939c3fd7c5d4853f87f8a5f`
          files: |
            app/build/outputs/apk/release/CamDiss-v0.1.4.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
